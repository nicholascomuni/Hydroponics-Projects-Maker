# Example design: the 51 m x 48 m lettuce greenhouse sized in the original notebook.
# Run with:  python -m hydroponics design --config examples/greenhouse_51x48.toml

[greenhouse]
length_m = 51.0          # benches run along the length
width_m = 48.0           # 6 bays of 8 m
bay_width_m = 8.0
benches_per_bay = 3
sectors = 5              # independent irrigation sectors (one pump + reservoir each)
min_aisle_width_m = 0.53

[[benches]]              # grow-out benches
count = 61
crop = "Lettuce (grow-out)"
length_m = 12.0
width_m = 1.8
channels = 8
profile = "PS85"

[[benches]]              # nursery benches: denser profile, more channels
count = 11
crop = "Lettuce (nursery)"
length_m = 12.0
width_m = 1.8
channels = 18
profile = "PS55"

[hydraulics]
main_pipe_mm = 50
lateral_pipe_mm = 32
bench_inlet_mm = 25
flow_per_channel_l_min = 1.5
flow_safety_factor = 1.3
terrain_slope_pct = 6.0
velocity_range_m_s = [0.5, 2.0]

[pump]
efficiency = 0.6
reservoir_volume_l = 3000
# model = "Your pump model"   # optional label used in the bill of materials
